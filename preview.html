<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #0b1120 0%, #151f33 100%);
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
  }
  .glow-1 {
    position: absolute;
    top: -100px;
    right: -100px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(20,184,166,0.18) 0%, transparent 70%);
    border-radius: 50%;
    z-index: 1;
  }
  .glow-2 {
    position: absolute;
    bottom: -80px;
    left: -80px;
    width: 350px;
    height: 350px;
    background: radial-gradient(circle, rgba(217,119,6,0.12) 0%, transparent 70%);
    border-radius: 50%;
    z-index: 1;
  }
  .bracket {
    position: absolute;
    font-family: 'JetBrains Mono', monospace;
    font-size: 120px;
    color: rgba(45,212,191,0.08);
    font-weight: 700;
    z-index: 1;
  }
  .bracket-left { top: 40%; left: 40px; }
  .bracket-right { top: 40%; right: 40px; }

  /* ============================================
     PROFILE IMAGE — res/mypic.jpg
     ============================================ */
  .profile-image-wrap {
    position: absolute;
    top: 80px;
    right: 80px;
    width: 260px;
    height: 260px;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Glow ring behind the image */
  .profile-image-wrap::before {
    content: '';
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #14b8a6, #2dd4bf, #d97706, #14b8a6);
    opacity: 0.55;
    filter: blur(10px);
    animation: rotateGlow 8s linear infinite;
    z-index: 1;
  }

  @keyframes rotateGlow {
    to { transform: rotate(360deg); }
  }

  /* Soft teal halo */
  .profile-image-wrap::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: rgba(45, 212, 191, 0.15);
    z-index: 1;
  }

  .profile-image {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #0b1120;
    box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.35);
    position: relative;
    z-index: 2;
    display: block;
  }

  /* ============================================
     MAIN CONTENT
     ============================================ */
  .content {
    position: relative;
    padding: 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
    box-sizing: border-box;
    max-width: 780px;
    z-index: 3;
  }
  .name {
    font-size: 96px;
    font-weight: 800;
    color: #f0f4f8;
    letter-spacing: -2px;
    margin: 0 0 12px 0;
    line-height: 1.05;
  }
  .title {
    font-size: 32px;
    font-weight: 500;
    color: #2dd4bf;
    margin: 0 0 24px 0;
    line-height: 1.3;
  }
  .skills {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    color: #a8b3c4;
    margin: 0 0 40px 0;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(52,211,153,0.12);
    border: 1px solid rgba(52,211,153,0.35);
    color: #34d399;
    font-size: 20px;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 24px;
    width: fit-content;
  }
  .dot {
    width: 8px;
    height: 8px;
    background: #34d399;
    border-radius: 50%;
  }
  .url {
    position: absolute;
    bottom: 60px;
    right: 80px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: #6b7a8f;
    z-index: 4;
  }
</style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="bracket bracket-left">&lt;</div>
  <div class="bracket bracket-right">/&gt;</div>

  <!-- Profile image — res/mypic.jpg -->
  <div class="profile-image-wrap">
    <img
      src="res/Ali-Raza.png"
      alt="Ali Raza — Software Engineer"
      class="profile-image"
    />
  </div>

  <div class="content">
    <h1 class="name">Ali Raza</h1>
    <p class="title">Software Engineer · Java Backend Developer · Spring Boot Engineer</p>
    <p class="skills">Java • Spring Boot • REST APIs • Microservices • MySQL</p>
    <div class="badge">
      <span class="dot"></span>
      Open to Work — Onsite · Remote · Part-time
    </div>
  </div>
  <div class="url">Ali-Raza-Muhammad-Iqbal.github.io/portfolio</div>
</body>
</html>
